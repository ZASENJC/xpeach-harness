name: Release Desktop (XPeach)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            artifact: xpeach-macos
          - os: ubuntu-22.04
            target: linux-x64
            artifact: xpeach-linux
          - os: windows-2022
            target: win-x64
            artifact: xpeach-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_APP_ID: codes.xpeach.harness
      DSH_DESKTOP_UNSIGNED: '1'
      DSH_DESKTOP_UPDATE_CHANNEL: latest
      XPEACH_GITHUB_RELEASE: '0'
      XPEACH_GITHUB_OWNER: yellowpeachxgp
      XPEACH_GITHUB_REPO: xpeach-harness
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host libraries
        run: pnpm run build:lib:host
      - name: Build workspace (client artifacts)
        if: matrix.target == 'linux-x64'
        env:
          DSH_CLIENT_BUILD_PROFILE: official
          DSH_CLIENT_TITLE: DeepSeek Harness
        run: pnpm run build
      - name: Provide Windows packaging env
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=codes.xpeach.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://xpeach.codes
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://xpeach.codes
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://xpeach.codes"]}
          EOF
      - name: Build desktop app
        run: pnpm run build:desktop
      - name: Package (macOS)
        if: matrix.target == 'mac-arm64'
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:mac:arm64:unsigned
      - name: Package (Windows)
        if: matrix.target == 'win-x64'
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned
      - name: Prepare Linux runtime
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          export DSH_DESKTOP_TARGET_PLATFORM=linux DSH_DESKTOP_TARGET_ARCH=x64
          pnpm --filter @deepseek-ai/dsh-desktop run prepare:runtime
          B="$PWD/apps/desktop/.desktop-build/targets/linux-x64"
          pnpm run release:pack --family dsh --out "$B/packed/dsh" --concurrency 4 || true
          pnpm run release:pack --family vendor --out "$B/packed/vendor" --concurrency 4 || true
          pnpm --filter @deepseek-ai/dsh-desktop run prepare:packages
          pnpm --filter @deepseek-ai/dsh-desktop run prepare:dsh
      - name: Package (Linux)
        if: matrix.target == 'linux-x64'
        run: pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --config electron-builder.config.mjs --linux AppImage --x64 --publish never --config.executableName=xpeach-harness --config.artifactName=xpeach-harness-${version}-${arch}.${ext} --config.publish.provider=github --config.publish.owner=yellowpeachxgp --config.publish.repo=xpeach-harness --config.publish.releaseType=draft
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find apps/desktop/.desktop-build apps/desktop/dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} out/ \; 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publish whatever built: a single failing target must not withhold the
    # installers that did succeed.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish draft release with all installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets
